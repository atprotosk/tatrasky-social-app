when:
  - event: ["push", "manual"]
    branch: ["**"]

engine: "nixery"

clone:
  depth: 0

dependencies:
  nixpkgs:
    - git

steps:
  - name: "Mirror everything to GitHub"
    command: |
      git remote add github "https://x-access-token:${GITHUB_PAT}@github.com/atprotosk/tatrasky-social-app.git"
      git fetch origin '+refs/heads/*:refs/mirror/heads/*' '+refs/tags/*:refs/mirror/tags/*'
      git push --prune github '+refs/mirror/heads/*:refs/heads/*' '+refs/mirror/tags/*:refs/tags/*'
    environment:
      GITHUB_PAT: "${{ secrets.GITHUB_PAT }}"
